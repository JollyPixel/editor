name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.e2e.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Select e2e suites
        id: e2e
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD~1' || github.event.before }}
        # TODO: enable voxel-map and voxel-model once their CI-only timeouts are fixed
        run: |
          matrix=$(node scripts/ciE2eMatrix.ts --base "$BASE" \
            --skip @jolly-pixel/editor.voxel-map \
            --skip @jolly-pixel/editor.voxel-model \
            --skip @jolly-pixel/studio)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build dependencies
        run: pnpm run build
      - name: Run lint
        run: pnpm run lint
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != '[]'
    name: e2e (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.e2e) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build ${{ matrix.suite.filter }} and its dependencies
        run: pnpm --filter "${{ matrix.suite.filter }}..." --if-present run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter ${{ matrix.suite.filter }} test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite.name }}-e2e-results
          path: ${{ matrix.suite.artifactPath }}
          if-no-files-found: ignore
          retention-days: 7
