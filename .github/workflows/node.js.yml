name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      pixel-art: ${{ steps.filter.outputs.pixel-art }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            ui:
              - 'packages/ui/**'
              - 'packages/resize-handle/**'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - '.github/workflows/node.js.yml'
            pixel-art:
              - 'packages/editors/pixel-art/**'
              - 'packages/pixel-draw-renderer/**'
              - 'packages/network/**'
              - 'packages/event-store/**'
              - 'packages/engine/**'
              - 'packages/runtime/**'
              - 'packages/resize-handle/**'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.json'
              - 'tsconfig.base.json'
              - '.github/workflows/node.js.yml'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
      fail-fast: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: build dependencies
        run: npm run build
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test

  ui-e2e:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build dependencies
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI E2E tests
        run: npm run test:e2e -w @jolly-pixel/ui
      - name: Upload UI E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-results
          path: packages/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  pixel-art-e2e:
    needs: changes
    if: needs.changes.outputs.pixel-art == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build dependencies
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Pixel Art E2E tests
        run: npm run test:e2e -w @jolly-pixel/editor.pixel-art
      - name: Upload Pixel Art E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixel-art-e2e-results
          path: packages/editors/pixel-art/test-results
          if-no-files-found: ignore
          retention-days: 7
