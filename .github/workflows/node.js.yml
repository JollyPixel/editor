name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.affected.outputs.e2e }}
      test: ${{ steps.affected.outputs.test }}
      build: ${{ steps.affected.outputs.build }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Select affected workspaces
        id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD~1' || '' }}
        # TODO: enable voxel-model once its CI-only timeouts are fixed
        # TODO: enable terrain once the editor is no longer WIP
        run: |
          node scripts/ci/affected.ts --base "$BASE" \
            --skip-e2e @jolly-pixel/editor.voxel-model \
            --skip-e2e @jolly-pixel/editor.terrain \
            --skip-e2e @jolly-pixel/studio >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm run lint
      - name: Run script tests
        run: pnpm run test:scripts
      - name: Build docs
        run: pnpm run docs:build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build libraries
        run: pnpm run build:libraries
      - name: Run typecheck
        run: pnpm run typecheck

  test:
    needs: changes
    if: needs.changes.outputs.test != ''
    runs-on: ubuntu-latest
    env:
      TEST_FILTERS: ${{ needs.changes.outputs.test }}
      BUILD_FILTERS: ${{ needs.changes.outputs.build }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build tested workspaces and their dependencies
        run: pnpm $BUILD_FILTERS --if-present run build
      - name: Run unit tests
        run: pnpm $TEST_FILTERS --if-present run test-only
      - name: Run type tests
        run: pnpm $TEST_FILTERS --if-present run test-types

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != '[]'
    name: e2e (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.e2e) }}
    env:
      SUITE_FILTER: ${{ matrix.suite.filter }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build ${{ matrix.suite.filter }} and its dependencies
        run: pnpm --filter "$SUITE_FILTER..." --if-present run build
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run E2E tests
        run: pnpm --filter "$SUITE_FILTER" test:e2e
      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite.name }}-e2e-results
          path: ${{ matrix.suite.artifactPath }}
          if-no-files-found: ignore
          retention-days: 7
