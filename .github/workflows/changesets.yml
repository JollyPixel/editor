name: Changesets
on:
  push:
    branches:
      - main
env:
  CI: true

permissions:
  contents: read

jobs:
  version:
    permissions:
      id-token: write # Required for OIDC publishing
      contents: write # Required for changesets to push version commit
      pull-requests: write # Required for changesets to create PRs
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build monorepo
        run: pnpm run build

      - name: Update and publish versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run ci:version
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm run ci:publish
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true
