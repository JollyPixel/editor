name: Changesets
on:
  push:
    branches:
      - main
env:
  CI: true

permissions:
  contents: read

jobs:
  version:
    permissions:
      id-token: write # Required for OIDC publishing
      contents: write # Required for changesets to push version commit
      pull-requests: write # Required for changesets to create PRs
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm run build

      - name: Update and publish versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run ci:version
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm run ci:publish
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true
