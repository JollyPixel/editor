name: Changesets
on:
  push:
    branches:
      - main
env:
  CI: true

permissions:
  contents: read

jobs:
  version:
    permissions:
      id-token: write # Required for OIDC publishing
      contents: write # Required for changesets to push version commit
      pull-requests: write # Required for changesets to create PRs
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build monorepo
        run: npm run build --if-present

      - name: Update and publish versions
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run ci:version
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: npm run ci:publish
        env:
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true
