<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Box - @jolly-pixel/three</title>
  <link rel="stylesheet" href="/main.css">
</head>

<body>
  <canvas tabindex="-1"></canvas>
  <jolly-scope>
    <jolly-controls
      position="bottom-left"
      max-entries-per-row="3"
      heading="Controls"
    >
      <jolly-control
        description="Select"
        details="Click an area to select it, click the ground to deselect."
      ><kbd>Click</kbd></jolly-control>
      <jolly-control
        description="Move"
        details="Drag the selected volume to move it on the ground plane."
      ><kbd>Drag</kbd></jolly-control>
      <jolly-control
        description="Resize"
        details="Drag a face arrow to move that face alone."
      ><kbd>Drag arrow</kbd></jolly-control>
      <jolly-control
        description="Rotate"
        details="Click one half of the corner arc to turn a quarter that way, or drag it around the pivot."
      ><kbd>Drag arc</kbd></jolly-control>
      <jolly-control
        description="Mirror"
        details="Click a chip beside a face to mirror the area through the pivot on that axis."
      ><kbd>Click chip</kbd></jolly-control>
      <jolly-control
        description="Move vertically"
        details="Hold Ctrl (Cmd on macOS) while dragging the volume, with move axes set to XYZ."
      ><kbd>Ctrl</kbd> + <kbd>Drag</kbd></jolly-control>
      <jolly-control
        description="Ignore the grid"
        details="Hold Alt during a gesture to suspend snapping."
      ><kbd>Alt</kbd></jolly-control>
    </jolly-controls>
  </jolly-scope>
  <script type="module" src="./main.ts"></script>
</body>

</html>
