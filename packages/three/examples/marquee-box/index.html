<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquee Box - @jolly-pixel/three</title>
  <link rel="stylesheet" href="/main.css">
</head>

<body>
  <canvas tabindex="-1"></canvas>
  <jolly-scope>
    <jolly-controls
      position="bottom-left"
      max-entries-per-row="3"
      heading="Controls"
    >
      <jolly-control
        description="Select"
        details="Hold Shift and drag over the ground to span the marquee across grid cells."
      ><kbd>Shift</kbd> + <kbd>Drag</kbd></jolly-control>
      <jolly-control
        description="Orbit"
        details="Drag with the primary mouse button to orbit around the marquee."
      ><kbd>Drag</kbd></jolly-control>
      <jolly-control
        description="Zoom"
        details="Use the mouse wheel to change the camera distance."
      ><kbd>Wheel</kbd></jolly-control>
    </jolly-controls>
  </jolly-scope>
  <script type="module" src="./main.ts"></script>
</body>

</html>
