<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Controls - @jolly-pixel/three</title>
  <link rel="stylesheet" href="/main.css">
</head>

<body>
  <canvas tabindex="-1"></canvas>
  <jolly-scope>
    <jolly-controls
      position="bottom-left"
      max-entries-per-row="3"
      heading="Controls"
    >
      <jolly-control
        description="Translate"
        details="Drag one colored handle to move the cube on that axis."
      ><kbd>Drag handle</kbd></jolly-control>
      <jolly-control
        description="Ignore the grid"
        details="Hold Alt during a gesture to suspend snapping."
      ><kbd>Alt</kbd> + <kbd>Drag</kbd></jolly-control>
      <jolly-control
        description="Orbit"
        details="Drag outside the gizmo to orbit the camera."
      ><kbd>Drag</kbd></jolly-control>
    </jolly-controls>
  </jolly-scope>
  <script type="module" src="./main.ts"></script>
</body>

</html>
