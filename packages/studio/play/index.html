<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JollyPixel Game</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #play-error {
      position: fixed;
      inset: auto 16px 16px;
      margin: 0;
      padding: 12px;
      border-radius: 6px;
      background: #2b1416;
      color: #ffb4ab;
      font: 13px/1.4 monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <canvas id="game-canvas" tabindex="0"></canvas>
  <pre id="play-error" role="alert" hidden></pre>
  <script type="module" src="../src/play/index.ts"></script>
</body>

</html>
