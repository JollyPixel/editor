<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat World (Sync)</title>
  <link rel="stylesheet" href="/main.css">
</head>

<body class="sky">
  <canvas tabindex="-1"></canvas>
  <div id="title">Flat World (Sync)</div>
  <jolly-scope>
    <jolly-controls
      position="bottom-left"
      max-entries-per-row="3"
      heading="Controls"
    >
      <jolly-control
        description="Add block"
        details="Click a voxel face to add a block beside it."
      ><kbd>Left click</kbd></jolly-control>
      <jolly-control
        description="Remove block"
        details="Right-click a voxel to remove it."
      ><kbd>Right click</kbd></jolly-control>
      <jolly-control
        description="Move"
        details="Move across the world relative to the camera direction."
      ><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></jolly-control>
      <jolly-control
        description="Ascend"
        details="Move upward while the key is held."
      ><kbd>Space</kbd></jolly-control>
      <jolly-control
        description="Descend"
        details="Move downward while the key is held."
      ><kbd>Shift</kbd></jolly-control>
      <jolly-control
        description="Look around"
        details="Hold the middle mouse button and drag to rotate the camera."
      ><kbd>Middle drag</kbd></jolly-control>
    </jolly-controls>
    <jolly-dock-layout storage-key="voxel-renderer-examples:layout">
      <jolly-dock id="tools" key="tools" side="right" align="start" overlay collapsible size="340"></jolly-dock>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./scripts/demo-flat-world.ts"></script>
</body>

</html>
