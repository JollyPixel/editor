<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Draw Renderer</title>
  <script>
    try {
      const theme = localStorage.getItem("pixel-draw-demo:theme");
      if (
        theme === "light" ||
        theme === "dark" ||
        theme === "auto"
      ) {
        document.documentElement.dataset.theme = theme;
      }
    } catch {
      // Storage can be unavailable in privacy-restricted contexts.
    }
  </script>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-dock id="draw-panel-dock" side="left" size="500" min-size="400" max-size="700">
    <jolly-pane id="draw-panel-pane">
      <pixel-draw-panel id="draw-panel" allow-uv-create-delete></pixel-draw-panel>
    </jolly-pane>
  </jolly-dock>
  <script>
    const initialTheme = document.documentElement.dataset.theme;
    if (initialTheme && initialTheme !== "auto") {
      document.querySelector("#draw-panel").setAttribute("theme", initialTheme);
    }
  </script>
  <div id="canvas-container">
    <canvas tabindex="-1" id="three-canvas"></canvas>
    <div id="demo-controls">
      <label id="rotation-control">
        <input id="rotation-toggle" type="checkbox" checked>
        Rotate
      </label>
      <jolly-scope>
        <jolly-theme-preferences
          id="theme-preferences"
          storage-key="pixel-draw-demo"
        ></jolly-theme-preferences>
      </jolly-scope>
    </div>
  </div>
  <script type="module" src="./scripts/main.ts"></script>
</body>

</html>
