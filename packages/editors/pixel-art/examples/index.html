<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Draw Renderer</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope>
    <jolly-dock id="draw-panel-dock" side="left" size="500" min-size="400" max-size="700">
      <jolly-pane id="draw-panel-pane">
        <pixel-draw-panel id="draw-panel" allow-uv-create-delete texture-import-policy="ask"></pixel-draw-panel>
      </jolly-pane>
    </jolly-dock>
    <div id="canvas-container">
      <canvas tabindex="-1" id="three-canvas"></canvas>
    </div>
  </jolly-scope>
  <script type="module" src="./scripts/main.ts"></script>
</body>

</html>
