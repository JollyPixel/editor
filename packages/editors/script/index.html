<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <div class="script-column">
      <jolly-editor-toolbar></jolly-editor-toolbar>
      <section id="script-view">
        <jolly-script-code></jolly-script-code>
        <jolly-markdown hidden></jolly-markdown>
        <jolly-presence-stack selectable max="6" hidden></jolly-presence-stack>
      </section>
    </div>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
