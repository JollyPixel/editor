<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="script:layout">
      <jolly-dock
        key="left"
        side="left"
        collapsible
        size="260"
        min-size="180"
        max-size="480"
      >
        <jolly-pane key="outline" heading="Outline" icon="script-outline" locked>
          <jolly-script-outline></jolly-script-outline>
        </jolly-pane>
      </jolly-dock>
      <div class="script-column">
        <jolly-editor-toolbar></jolly-editor-toolbar>
        <section id="script-view">
          <jolly-script-code></jolly-script-code>
          <jolly-presence-stack selectable max="6" hidden></jolly-presence-stack>
        </section>
      </div>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
