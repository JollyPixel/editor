<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="sound:layout">
      <jolly-dock
        key="left"
        side="left"
        collapsible
        size="280"
        min-size="200"
        max-size="480"
      >
        <jolly-pane key="sound" heading="Sound" icon="sound-wave" locked>
          <jolly-sound-file></jolly-sound-file>
          <jolly-sound-details></jolly-sound-details>
        </jolly-pane>
      </jolly-dock>
      <div class="sound-column">
        <jolly-editor-toolbar></jolly-editor-toolbar>
        <section id="sound-view">
          <jolly-sound-track></jolly-sound-track>
          <jolly-sound-wave></jolly-sound-wave>
          <jolly-presence-stack selectable max="6" hidden></jolly-presence-stack>
        </section>
      </div>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
