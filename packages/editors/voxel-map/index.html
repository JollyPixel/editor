<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Map Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="voxel-map:layout">
      <jolly-dock
        key="left"
        side="left"
        drop="tabs"
        double
        share-tone
        collapsible
        size="380"
        min-size="200"
        max-size="600"
      >
        <jolly-pane-group active="blocks">
          <jolly-pane key="blocks" float-width="380" float-height="520" heading="Blocks" icon="blocks">
            <blocks-panel></blocks-panel>
          </jolly-pane>
          <jolly-pane key="materials" float-width="380" float-height="600" heading="Materials" icon="material">
            <materials-panel></materials-panel>
          </jolly-pane>
          <jolly-pane key="paint" float-width="480" float-height="600" heading="Paint" icon="pencil">
            <paint-panel></paint-panel>
          </jolly-pane>
          <jolly-pane key="layers" float-width="380" float-height="520" heading="Layers" icon="layers">
            <layers-panel></layers-panel>
          </jolly-pane>
        </jolly-pane-group>
      </jolly-dock>
      <div class="viewport-column">
        <jolly-editor-toolbar></jolly-editor-toolbar>
        <div id="game-container">
          <canvas tabindex="-1"></canvas>
          <jolly-log></jolly-log>
          <jolly-presence-stack selectable max="6" hidden></jolly-presence-stack>
          <div class="viewport-toolbars">
            <voxel-edit-toolbar></voxel-edit-toolbar>
          </div>
        </div>
      </div>
      <jolly-dock
        key="right"
        side="right"
        drop="tabs"
        collapsible
        size="380"
        min-size="200"
        max-size="600"
      ></jolly-dock>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
