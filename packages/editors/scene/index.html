<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="scene:layout">
      <jolly-dock
        key="left"
        side="left"
        collapsible
        size="280"
        min-size="200"
        max-size="600"
      >
        <jolly-pane key="hierarchy" heading="Hierarchy" icon="scene-hierarchy" locked>
          <jolly-scene-hierarchy></jolly-scene-hierarchy>
        </jolly-pane>
      </jolly-dock>
      <div class="viewport-column">
        <jolly-editor-toolbar></jolly-editor-toolbar>
        <section id="scene-viewport">
          <canvas tabindex="-1"></canvas>
          <jolly-log></jolly-log>
          <jolly-presence-stack selectable max="6" hidden></jolly-presence-stack>
          <div class="viewport-toolbars">
            <jolly-scene-toolbar></jolly-scene-toolbar>
          </div>
        </section>
      </div>
      <jolly-dock
        key="right"
        side="right"
        collapsible
        size="340"
        min-size="260"
        max-size="700"
      >
        <jolly-pane-group active="inspector">
          <jolly-pane key="inspector" heading="Inspector" icon="scene-inspector" locked>
            <jolly-scene-inspector></jolly-scene-inspector>
          </jolly-pane>
          <jolly-pane key="environment" heading="Scene" icon="scene-environment" locked>
            <jolly-scene-environment></jolly-scene-environment>
          </jolly-pane>
        </jolly-pane-group>
      </jolly-dock>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
