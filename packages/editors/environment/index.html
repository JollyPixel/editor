<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environment Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="environment:layout">
      <jolly-dock
        key="left"
        side="left"
        collapsible
        size="300"
        min-size="220"
        max-size="480"
      >
        <jolly-pane-group active="environment">
          <jolly-pane key="environment" heading="Environment" icon="environment-sun" locked>
            <jolly-environment-panel></jolly-environment-panel>
          </jolly-pane>
        </jolly-pane-group>
      </jolly-dock>
      <div class="viewport-column">
        <jolly-editor-toolbar></jolly-editor-toolbar>
        <section id="environment-viewport">
          <canvas tabindex="-1"></canvas>
        </section>
      </div>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
