<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Model Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    position: relative;
  }

  section {
    flex-grow: 1;
    height: 100%;
    min-width: 200px;
  }

  jolly-scope {
    display: contents;
  }
</style>

<jolly-scope>
  <jolly-dock key="left" side="left" collapsible min-size="200" max-size="500" storage-key="voxel-model:left">
    <jolly-pane heading="Build" locked>
      <jolly-model-editor-left-panel></jolly-model-editor-left-panel>
    </jolly-pane>
  </jolly-dock>
  <section id="threeRenderer"></section>
  <jolly-dock key="right" side="right" collapsible min-size="200" max-size="500" storage-key="voxel-model:right">
    <jolly-pane heading="Scene" locked>
      <jolly-model-editor-right-panel></jolly-model-editor-right-panel>
    </jolly-pane>
  </jolly-dock>
</jolly-scope>

<script type="module" src="./src/index.ts"></script>

</html>
