<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Model Editor</title>
  <link rel="stylesheet" href="./main.css">
</head>

<body>
  <jolly-scope theme="dark" density="comfortable">
    <jolly-dock-layout storage-key="voxel-model:layout">
      <jolly-dock
        key="left"
        side="left"
        collapsible
        min-size="500"
        max-size="900"
      >
        <jolly-pane-group active="build">
          <jolly-pane key="build" heading="Build" icon="model-build" locked>
            <jolly-model-editor-left-panel></jolly-model-editor-left-panel>
          </jolly-pane>
          <jolly-pane key="paint" heading="Paint" icon="model-paint" locked></jolly-pane>
          <jolly-pane key="animate" heading="Animate" icon="model-animate" locked disabled></jolly-pane>
        </jolly-pane-group>
      </jolly-dock>
      <section id="three-renderer"><canvas tabindex="-1"></canvas></section>
      <jolly-dock
        key="right"
        side="right"
        collapsible
        min-size="400"
        max-size="700"
      >
        <jolly-pane key="model" heading="Model" icon="model-hierarchy" locked>
          <jolly-model-editor-right-panel></jolly-model-editor-right-panel>
        </jolly-pane>
      </jolly-dock>
    </jolly-dock-layout>
  </jolly-scope>
  <script type="module" src="./src/index.ts"></script>
</body>

</html>
