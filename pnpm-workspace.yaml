packages:
  - packages/*
  - packages/assets/*
  - packages/editors/*

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@openally/*'
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Transitive through vitepress 1.6.4 only; the vite 5.x maintenance line
  - vite@5.4.21
trustPolicyExcludePrune: true
trustLockfile: false

strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  esbuild: false
  node-av: false

# Resolution
linkWorkspacePackages: false
saveExact: true
savePrefix: ""
patchedDependencies:
  three@0.187.0: patches/three@0.187.0.patch
overrides:
  "@openally/config.stylelint>stylelint": "18.0.0"
  "@openally/config.stylelint>stylelint-config-standard": "41.0.0"
  "@openally/config.stylelint>@stylistic/stylelint-plugin": "6.0.1"
